<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohan Nale | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="nav">
        <div class="logo">●</div>
        <nav>
            <button onclick="showTab('home')">Home</button>
            <button onclick="showTab('about')">About</button>
            <button onclick="showTab('projects')">Portfolio</button>
            <button onclick="showTab('contact')">Contact</button>
        </nav>
        <button class="contact-btn">Get in Touch</button>
    </header>

    <main>
        <!-- HOME SECTION -->
        <section id="home" class="content active">
            <div class="hero-container">
                <div class="hero-image-wrapper">
                    <!-- Replace 'your-photo.jpg' with your actual image file -->
                    <img src="your-photo.jpg" alt="Sohan Nale" class="hero-img">
                    <div class="green-highlight"></div>
                </div>
                
                <div class="hero-text">
                    <h1>Sohan<br>Nale</h1>
                    <p class="hero-description">
                        Hello, my name is Sohan Nale. I am an Electronics and Telecommunication Engineering student 
                        specializing in Embedded Systems and IoT Solutions.
                    </p>
                </div>
            </div>
            <div class="scroll-indicator">0</div>
        </section>

        <!-- OTHER SECTIONS -->
        <section id="about" class="content">
            <h2>About Me</h2>
            <p>Electronics student at MIT Academy of Engineering.</p>
        </section>

        <section id="projects" class="content">
            <h2>Projects</h2>
            <div class="project-grid">
                <article class="project-card"><h3>Gesture Control</h3></article>
                <article class="project-card"><h3>SwiftPass App</h3></article>
                <article class="project-card"><h3>Street Light Dimmer</h3></article>
            </div>
        </section>

        <section id="contact" class="content">
            <h2>Contact</h2>
            <form class="contact-form">
                <input type="text" placeholder="Name">
                <input type="email" placeholder="Email">
                <textarea placeholder="Message"></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <script>
        function showTab(tabId) {
            const sections = document.querySelectorAll('.content');
            sections.forEach(s => s.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
